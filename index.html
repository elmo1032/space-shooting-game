<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Space Shooting Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background: radial-gradient(ellipse at center, #000000 0%, #0f2027 100%);
      overflow: hidden;
    }
    #gameCanvas {
      background: #111;
      display: block;
      margin: 0 auto;
      border: 2px solid #0ff;
      border-radius: 8px;
    }
    .scoreboard {
      color: #0ff;
      font-size: 1.25rem;
      text-align: center;
      margin-top: 1rem;
      user-select: none;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">
  <canvas id="gameCanvas" width="480" height="640" class="shadow-lg"></canvas>
  <div class="scoreboard" id="scoreBoard">Score: 0</div>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const spaceshipWidth = 40;
    const spaceshipHeight = 40;
    const bulletWidth = 5;
    const bulletHeight = 10;
    const enemyWidth = 40;
    const enemyHeight = 40;

    let spaceshipX = canvas.width / 2 - spaceshipWidth / 2;
    const spaceshipY = canvas.height - spaceshipHeight - 10;
    const spaceshipSpeed = 7;

    let rightPressed = false;
    let leftPressed = false;
    let spacePressed = false;

    let bullets = [];
    let enemies = [];
    let enemySpeed = 2;
    let enemySpawnInterval = 1500;
    let lastEnemySpawn = 0;

    let score = 0;
    let gameOver = false;

    // Load spaceship image (using FontAwesome rocket icon as fallback)
    function drawSpaceship() {
      ctx.fillStyle = '#0ff';
      ctx.beginPath();
      ctx.moveTo(spaceshipX + spaceshipWidth / 2, spaceshipY);
      ctx.lineTo(spaceshipX, spaceshipY + spaceshipHeight);
      ctx.lineTo(spaceshipX + spaceshipWidth, spaceshipY + spaceshipHeight);
      ctx.closePath();
      ctx.fill();
    }

    function drawBullet(bullet) {
      ctx.fillStyle = '#ff0';
      ctx.fillRect(bullet.x, bullet.y, bulletWidth, bulletHeight);
    }

    function drawEnemy(enemy) {
      ctx.fillStyle = '#f00';
      ctx.fillRect(enemy.x, enemy.y, enemyWidth, enemyHeight);
    }

    function moveSpaceship() {
      if (rightPressed && spaceshipX + spaceshipWidth < canvas.width) {
        spaceshipX += spaceshipSpeed;
      }
      if (leftPressed && spaceshipX > 0) {
        spaceshipX -= spaceshipSpeed;
      }
    }

    function moveBullets() {
      bullets.forEach((bullet, index) => {
        bullet.y -= 10;
        if (bullet.y + bulletHeight < 0) {
          bullets.splice(index, 1);
        }
      });
    }

    function moveEnemies() {
      enemies.forEach((enemy, index) => {
        enemy.y += enemySpeed;
        if (enemy.y > canvas.height) {
          gameOver = true;
        }
      });
    }

    function spawnEnemy(timestamp) {
      if (timestamp - lastEnemySpawn > enemySpawnInterval) {
        const x = Math.random() * (canvas.width - enemyWidth);
        enemies.push({ x, y: -enemyHeight });
        lastEnemySpawn = timestamp;
      }
    }

    function detectCollisions() {
      bullets.forEach((bullet, bIndex) => {
        enemies.forEach((enemy, eIndex) => {
          if (
            bullet.x < enemy.x + enemyWidth &&
            bullet.x + bulletWidth > enemy.x &&
            bullet.y < enemy.y + enemyHeight &&
            bullet.y + bulletHeight > enemy.y
          ) {
            bullets.splice(bIndex, 1);
            enemies.splice(eIndex, 1);
            score += 10;
            document.getElementById('scoreBoard').textContent = 'Score: ' + score;
          }
        });
      });
    }

    function drawGameOver() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#f00';
      ctx.font = '48px Orbitron, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
      ctx.font = '24px Orbitron, sans-serif';
      ctx.fillText('Final Score: ' + score, canvas.width / 2, canvas.height / 2 + 40);
    }

    function gameLoop(timestamp) {
      if (gameOver) {
        drawGameOver();
        return;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      moveSpaceship();
      moveBullets();
      moveEnemies();
      detectCollisions();
      spawnEnemy(timestamp);

      drawSpaceship();
      bullets.forEach(drawBullet);
      enemies.forEach(drawEnemy);

      requestAnimationFrame(gameLoop);
    }

    function shootBullet() {
      bullets.push({ x: spaceshipX + spaceshipWidth / 2 - bulletWidth / 2, y: spaceshipY });
    }

    document.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowRight') rightPressed = true;
      if (e.code === 'ArrowLeft') leftPressed = true;
      if (e.code === 'Space') {
        if (!spacePressed) {
          shootBullet();
          spacePressed = true;
        }
      }
    });

    document.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowRight') rightPressed = false;
      if (e.code === 'ArrowLeft') leftPressed = false;
      if (e.code === 'Space') spacePressed = false;
    });

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
